name: Apply compatible npm audit fixes

on:
  push:
    branches:
      - security/apply-npm-audit-fixes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit-fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Apply non-breaking audit fixes
        working-directory: app
        run: npm audit fix || true

      - name: Report remaining vulnerabilities
        working-directory: app
        run: |
          npm audit --json > npm-audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'))
          const vulnerabilities = report.vulnerabilities || {}
          const counts = report.metadata?.vulnerabilities || {}
          console.log('Remaining audit summary:', JSON.stringify(counts))
          for (const [name, item] of Object.entries(vulnerabilities)) {
            console.log(`${item.severity.toUpperCase()} ${name} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable)}`)
          }
          NODE

      - name: Commit updated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible dependency updates were available."
          else
            git commit -m "security: apply compatible npm audit fixes"
            git push origin "HEAD:security/apply-npm-audit-fixes"
          fi
