name: App CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Dependency audit report
        working-directory: app
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))

          if (report.error) {
            console.error('npm audit report unavailable:', report.error.summary || report.error.code)
            process.exit(0)
          }

          const entries = Object.entries(report.vulnerabilities || {})
          if (entries.length === 0) {
            console.log('No dependency vulnerabilities found.')
            process.exit(0)
          }

          for (const [name, item] of entries) {
            const advisories = (item.via || []).map((entry) => (
              typeof entry === 'string'
                ? entry
                : `${entry.title}${entry.url ? ` (${entry.url})` : ''}`
            )).join('; ')
            console.log(`${item.severity.toUpperCase()} ${name} | range=${item.range} | direct=${item.isDirect} | fix=${JSON.stringify(item.fixAvailable)} | ${advisories}`)
          }
          NODE

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build
