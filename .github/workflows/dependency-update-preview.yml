name: Preview compatible dependency updates

on:
  push:
    branches:
      - security/npm-update-compatible-deps

permissions:
  contents: write

concurrency:
  group: dependency-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip dependency preview]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Update npm
        run: npm install --global npm@11

      - name: Update dependencies within declared semver ranges
        working-directory: app
        run: npm update

      - name: Report remaining audit findings
        working-directory: app
        run: |
          npm audit --json > npm-audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities || {}
          console.log('Dependency audit summary:', JSON.stringify(counts))
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const advisories = (item.via || []).map((entry) => (
              typeof entry === 'string' ? entry : `${entry.title} (${entry.url || 'no URL'})`
            )).join('; ')
            console.log(`${item.severity.toUpperCase()} ${name} | range=${item.range} | direct=${item.isDirect} | fix=${JSON.stringify(item.fixAvailable)} | ${advisories}`)
          }
          NODE

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm run test

      - name: Production build
        working-directory: app
        run: npm run build

      - name: Commit verified lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile updates were produced within the declared semver ranges."
            exit 0
          fi
          git commit -m "chore(deps): apply compatible audit updates [skip dependency preview]"
          git push origin HEAD:security/npm-update-compatible-deps
