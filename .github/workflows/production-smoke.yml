name: Production browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check production homepage and birth entry
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto('https://tianyan-ziwei-main.onrender.com/', {waitUntil:'domcontentloaded',timeout:90000});
            if (!response?.ok()) throw Error('Production HTTP '+response?.status());
            await page.getByRole('button',{name:'进入起紫微命盘',exact:true}).waitFor({timeout:30000});
            await page.screenshot({path:'homepage.png'});
            await page.getByRole('button',{name:'进入起紫微命盘',exact:true}).click();
            await page.getByText('输入生辰八字',{exact:false}).first().waitFor({timeout:30000});
            await page.getByPlaceholder('请输入姓名').waitFor();
            await page.screenshot({path:'birth-entry.png',fullPage:true});
            if(errors.length) throw Error(errors.join('\n'));
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-screenshots
          path: '*.png'
