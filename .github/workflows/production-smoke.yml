name: Production browser smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check production homepage and birth entry
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto('https://tianyan-ziwei-main.onrender.com/', {waitUntil:'domcontentloaded',timeout:90000});
            if (!response?.ok()) throw Error('Production HTTP '+response?.status());
            await page.getByRole('button',{name:'进入起紫微命盘',exact:true}).waitFor({timeout:30000});
            await page.screenshot({path:'homepage.png'});
            await page.getByRole('button',{name:'进入起紫微命盘',exact:true}).click();
            await page.getByText('输入生辰八字',{exact:false}).first().waitFor({timeout:30000});
            await page.getByPlaceholder('请输入姓名').waitFor();
            await page.screenshot({path:'birth-entry.png',fullPage:true});
            await page.getByPlaceholder('请输入姓名').fill('QA Test');
            await page.getByRole('button',{name:'开始排盘',exact:true}).click();
            await page.getByRole('navigation',{name:'命盘功能'}).waitFor({timeout:60000});
            await page.getByRole('button',{name:'命盘分析',exact:true}).waitFor();
            await page.screenshot({path:'chart-desktop.png',fullPage:true});
            await page.getByRole('button',{name:'AI 对话',exact:true}).click();
            await page.screenshot({path:'chart-ai.png',fullPage:true});
            for (const label of ['大限','流年','流月','本命']) {
              await page.getByRole('navigation',{name:'命盘功能'}).getByRole('button',{name:label,exact:true}).click();
              await page.getByRole('navigation',{name:'命盘功能'}).waitFor();
            }
            await page.setViewportSize({width:390,height:844});
            await page.screenshot({path:'chart-mobile.png',fullPage:true});
            if(errors.length) throw Error(errors.join('\n'));
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-screenshots
          path: '*.png'
